<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aetheria Starbridge</title>
  <link rel="stylesheet" href="../node_modules/@gamecult/eve-browser-lowering/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="status" class="status">Connecting</div>
  <div class="window-drag-region" aria-hidden="true"></div>
  <div class="window-controls" aria-label="Window controls">
    <button class="window-control" type="button" data-window-control="minimize" aria-label="Minimize">-</button>
    <button class="window-control" type="button" data-window-control="maximize" aria-label="Maximize">[]</button>
    <button class="window-control window-control-close" type="button" data-window-control="close" aria-label="Close">x</button>
  </div>
  <main id="eve-surface-host" class="eve-surface-host" aria-label="Aetheria daemon Eve surface"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
