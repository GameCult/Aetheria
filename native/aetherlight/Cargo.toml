[package]
name = "aetherlight"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: the crate builds on its own, outside any parent manifest.
[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "85f7024a35ea42cf9f0a0199a064526427150191", package = "cultcache-rs" }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1.25"
unicode-properties = "0.1.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
